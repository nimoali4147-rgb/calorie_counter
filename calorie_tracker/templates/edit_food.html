{% extends "base.html" %}

{% block title %}
Edit Food
{% endblock %}


{% block content %}

<section class="px-6 py-12">

    <div class="mx-auto max-w-xl">

        <div class="rounded-2xl bg-white p-8 shadow-md">

            <h1 class="mb-6 text-3xl font-bold">
                Edit Food
            </h1>

            <form method="POST">

                {% csrf_token %}

                <div class="space-y-5">

                    <div>
                        <label class="mb-2 block font-medium">
                            Food Name
                        </label>

                        {{ form.name }}
                    </div>


                    <div>
                        <label class="mb-2 block font-medium">
                            Calories
                        </label>

                        {{ form.calories }}
                    </div>


                    <button
                        type="submit"
                        class="w-full rounded-lg bg-orange-500 px-5 py-3 font-semibold text-white hover:bg-orange-600">

                        Save Changes

                    </button>


                    <a
                        href="{% url 'home' %}"
                        class="block text-center text-gray-500 hover:text-gray-900">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
