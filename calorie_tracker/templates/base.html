<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Calorie Counter{% endblock %}
    </title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-orange-50 text-gray-900">

    <header class="bg-gray-900 text-white">
        <div class="max-w-6xl mx-auto px-6 py-5">

            <div class="flex items-center justify-between">

                <a href="{% url 'home' %}"
                   class="text-2xl font-bold">
                    Calorie<span class="text-orange-400">Counter</span>
                </a>

                <a href="{% url 'home' %}"
                   class="text-sm text-gray-300 hover:text-white">
                    Home
                </a>

            </div>

        </div>
    </header>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer class="mt-16 bg-gray-900 py-6 text-center text-gray-400">
        <p>
            © 2026 Calorie Counter. Built with Django.
        </p>
    </footer>

</body>
</html>
